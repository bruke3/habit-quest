<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habit Quest</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>Habit Quest ⚔️</h1>

        <div class="hero-card">

            <h2 id="hero-name">
                Bruke the Adventurer
            </h2>

            <p id="level">
                Level: 1
            </p>

            <p id="xp">
                XP: 0 / 100
            </p>

            <div class="progress-bar">

                <div id="progress-fill">

                </div>
            </div>
        </div>
        <div class="habits">

            <button id="read-btn">
                📚 Read 30 Minutes (+10 XP)
            </button>

            <button id="workout-btn">
                💪 Workout (+20 XP)
            </button>

            <button id="code-btn">
                 💻 Code 1 Hour (+25 XP)
            </button>
        </div>

    </div>

    <script src="script.js"></script>
    
</body>
</html>
